plugins {
    id 'com.android.application'
}

// Release signing: reads the key's location and passwords from a private properties file kept
// outside the repo (default ~/.flipex/keystore.properties, or FLIPEX_KEYSTORE_PROPERTIES).
// Without it, release builds are produced unsigned.
def keystorePropsFile = file(System.getenv('FLIPEX_KEYSTORE_PROPERTIES')
        ?: "${System.getProperty('user.home')}/.flipex/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'dev.ved.flipdex'
    compileSdk 36

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false  // the shell service calls hidden APIs by reflection
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }

    defaultConfig {
        applicationId 'dev.ved.flipdex'
        minSdk 31
        targetSdk 36
        versionCode 2
        versionName '0.2'
    }

    buildFeatures { aidl true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def shizuku = '13.1.5'
    implementation "dev.rikka.shizuku:api:$shizuku"
    implementation "dev.rikka.shizuku:provider:$shizuku"
}
